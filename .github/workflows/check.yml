# A pull request into `main`, or a manual run -> the same checks and build as a
# deploy, without deploying. `main` is the only branch since 24 Sep 2026, so
# this runs only when a change is proposed from elsewhere (e.g. Dependabot).
# It needs no Cloudflare secrets: nothing here talks to Cloudflare.
name: Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # The tests need no database server: Backend2's suites run a real
      # PostgreSQL in process (PGlite).
      # The type check and the Cloudflare build outgrow Node's default heap.
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Vite 7 needs Node 22 or newer.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      # A broken build must never reach the live site.
      - run: bun run typecheck
      - run: bun run test

      - name: Require the production Turnstile site key
        run: test -n "$VITE_TURNSTILE_SITE_KEY"
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}

      - run: bun run build:cf
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
