# Push to `main` -> the site rebuilds and deploys itself.
#
# Two secrets have to exist in the GitHub repository settings:
#   CLOUDFLARE_API_TOKEN   — created in the Cloudflare dashboard
#   CLOUDFLARE_ACCOUNT_ID  — 9e77752659ea97f8c387249ac9fbeee1
#
# Application secrets (DATABASE_URL, BETTER_AUTH_SECRET, ...) are NOT here.
# They live in Cloudflare, set once with `wrangler secret put`, and a deploy
# never touches them.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: personal_platform_test
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform -d personal_platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://platform:platform_test_password@127.0.0.1:5432/personal_platform_test
      TEST_DATABASE_URL: postgresql://platform:platform_test_password@127.0.0.1:5432/personal_platform_test
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-that-is-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3000
      BASE_URL: http://localhost:3000
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      RATE_LIMIT_SECRET: ci-only-rate-limit-secret-that-is-at-least-32-characters
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Vite 7 needs Node 22 or newer.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      # A broken build must never reach the live site.
      - run: bun run db:migrate
      - run: bun run typecheck
      - run: bun run test

      - name: Require the production Turnstile site key
        run: test -n "$VITE_TURNSTILE_SITE_KEY"
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}

      - run: bun run build:cf
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}

      - run: bunx wrangler deploy --config .output/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
