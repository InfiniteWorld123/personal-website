# Push to `main` -> the site rebuilds and deploys itself.
#
# Two secrets have to exist in the GitHub repository settings:
#   CLOUDFLARE_API_TOKEN   — created in the Cloudflare dashboard
#   CLOUDFLARE_ACCOUNT_ID  — 9e77752659ea97f8c387249ac9fbeee1
#
# Application secrets (DATABASE_URL_V2, AUTH_V2_SECRET, ...) are NOT here.
# They live in Cloudflare, set once with `wrangler secret put`, and a deploy
# never touches them.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # The tests need no database server: Backend2's suites run a real
      # PostgreSQL in process (PGlite).
      # The type check and the Cloudflare build outgrow Node's default heap.
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Vite 7 needs Node 22 or newer.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      # A broken build must never reach the live site.
      - run: bun run typecheck
      - run: bun run test

      - name: Require the production Turnstile site key
        run: test -n "$VITE_TURNSTILE_SITE_KEY"
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}

      - run: bun run build:cf
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}

      - run: bunx wrangler deploy --config .output/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
